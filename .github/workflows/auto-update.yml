name: Auto-update posts

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch new posts from RSS feeds
        shell: pwsh
        run: |
          ./fetch-updates.ps1

      - name: Download official PDFs
        shell: pwsh
        run: |
          ./download-pdfs.ps1
        continue-on-error: true

      - name: Generate post HTML pages
        shell: pwsh
        run: |
          ./generate-posts.ps1

      - name: Generate homepage from posts
        shell: pwsh
        run: |
          ./generate-homepage.ps1
          if (Test-Path "index-auto.html") {
            Move-Item -Force "index-auto.html" "index.html"
            Write-Output "Replaced index.html with auto-generated version"
          }

      - name: Regenerate sitemap.xml
        shell: pwsh
        run: |
          ./generate-sitemap.ps1

      - name: Ping search engines
        shell: pwsh
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT }}
        run: |
          ./ping-sitemap.ps1
        continue-on-error: true

      - name: Post to social media
        shell: pwsh
        env:
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT_ID: ${{ secrets.WHATSAPP_RECIPIENT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
        run: |
          ./post-social.ps1
        continue-on-error: true

      - name: Commit and push changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          $diff = git diff --cached --quiet 2>&1
          if ($LASTEXITCODE -ne 0) {
            git commit -m "auto: new posts, sitemap, social update $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            git push
            Write-Output "Changes pushed"
          } else {
            Write-Output "No changes to commit"
          }
