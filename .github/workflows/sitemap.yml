name: Auto-generate sitemap.xml

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sitemap.xml
        shell: pwsh
        run: |
          ./generate-sitemap.ps1

      - name: Commit if changed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          $diff = git diff --cached --quiet 2>&1
          if ($LASTEXITCODE -ne 0) {
            git commit -m "auto: regenerate sitemap.xml"
            git push
            Write-Output "sitemap.xml updated and pushed"
          } else {
            Write-Output "sitemap.xml unchanged, nothing to commit"
          }
