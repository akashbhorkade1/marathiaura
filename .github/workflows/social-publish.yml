name: Social Publish (Instagram — published articles only)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles per run'
        required: false
        default: '5'
      post_id:
        description: 'Publish only this post id (optional)'
        required: false
        default: ''
  # Phase B: Deploy workflow यशस्वी झाल्यानंतरच publish करा.
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

# Deploy नंतरच — public image URL उपलब्ध हवी. Push वर नाही (duplicate टाळा).

permissions:
  contents: write
  actions: write

jobs:
  # Phase A — Generate assets: JPEG image + caption तयार करा, status='ready' नोंदवा, commit/push करा. Instagram API कॉल नको.
  generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ImageMagick (svg → jpeg conversion)
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick
      - name: Phase A — Generate social assets (JPEG + caption, no Instagram publish)
        run: node automation/social-publish.mjs --phase=generate --limit=${{ inputs.limit || '5' }} ${{ inputs.post_id && format('--id={0}', inputs.post_id) || '' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ secrets.IG_GRAPH_HOST }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
      - name: Commit social artifacts + status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts assets/social 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No social changes — skipping commit"
          else
            git commit -m "social: artifacts + instagram status"
            git push
          fi
      - name: Explicitly trigger Deploy workflow after push
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Phase B — Publish after successful deployment: deploy workflow च्या name शी जुळणारा workflow_run trigger वापर.
  publish:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ImageMagick (jpeg verification + dimension check)
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick
      - name: Phase B — Publish after successful deploy
        run: node automation/social-publish.mjs --phase=publish --limit=5
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ secrets.IG_GRAPH_HOST }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
      - name: Commit publish status (always, even on API failure)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts assets/social 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No social status changes — skipping commit"
          else
            git commit -m "social: publish status [skip ci]"
            git push
          fi
