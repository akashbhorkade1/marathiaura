name: Social Publish (Instagram Ã¢ÂÂ published articles only)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles per run'
        required: false
        default: '5'
      post_id:
        description: 'Publish only this post id (optional)'
        required: false
        default: ''
  # Phase B: Deploy workflow Ã Â¤Â¯Ã Â¤Â¶Ã Â¤Â¸Ã Â¥ÂÃ Â¤ÂµÃ Â¥Â Ã Â¤ÂÃ Â¤Â¾Ã Â¤Â²Ã Â¥ÂÃ Â¤Â¯Ã Â¤Â¾Ã Â¤Â¨Ã Â¤ÂÃ Â¤Â¤Ã Â¤Â°Ã Â¤Â publish Ã Â¤ÂÃ Â¤Â°Ã Â¤Â¾.
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

# Deploy Ã Â¤Â¨Ã Â¤ÂÃ Â¤Â¤Ã Â¤Â°Ã Â¤Â Ã¢ÂÂ public image URL Ã Â¤ÂÃ Â¤ÂªÃ Â¤Â²Ã Â¤Â¬Ã Â¥ÂÃ Â¤Â§ Ã Â¤Â¹Ã Â¤ÂµÃ Â¥Â. Push Ã Â¤ÂµÃ Â¤Â° Ã Â¤Â¨Ã Â¤Â¾Ã Â¤Â¹Ã Â¥Â (duplicate Ã Â¤ÂÃ Â¤Â¾Ã Â¤Â³Ã Â¤Â¾).

permissions:
  contents: write
  actions: write

jobs:
  # Phase A Ã¢ÂÂ Generate assets: JPEG image + caption Ã Â¤Â¤Ã Â¤Â¯Ã Â¤Â¾Ã Â¤Â° Ã Â¤ÂÃ Â¤Â°Ã Â¤Â¾, status='ready' Ã Â¤Â¨Ã Â¥ÂÃ Â¤ÂÃ Â¤Â¦Ã Â¤ÂµÃ Â¤Â¾, commit/push Ã Â¤ÂÃ Â¤Â°Ã Â¤Â¾. Instagram API Ã Â¤ÂÃ Â¥ÂÃ Â¤Â² Ã Â¤Â¨Ã Â¤ÂÃ Â¥Â.
  generate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ImageMagick (svg Ã¢ÂÂ jpeg conversion)
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick
      - name: Phase A Ã¢ÂÂ Generate social assets (JPEG + caption, no Instagram publish)
        run: node automation/social-publish.mjs --phase=generate --limit=${{ inputs.limit || '5' }} ${{ inputs.post_id && format('--id={0}', inputs.post_id) || '' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ secrets.IG_GRAPH_HOST }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
      - name: Commit social artifacts + status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts assets/social 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No social changes Ã¢ÂÂ skipping commit"
          else
            git commit -m "social: artifacts + instagram status"
            git push
          fi
      - name: Dispatch deployment workflow
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install ImageMagick (jpeg verification + dimension check)
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick
      - name: Download deployment receipt artifact from triggering workflow run
        uses: actions/download-artifact@v8
        with:
          name: deployment-receipt
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: assets/social
      - name: Phase B Publish after successful deploy
        run: node automation/social-publish.mjs --phase=publish --limit=5
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ secrets.IG_GRAPH_HOST }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
      - name: Commit publish status (always, even on API failure)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts assets/social 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No social status changes - skipping commit"
          else
            git commit -m "social: publish status [skip ci]"
            git push
          fi
